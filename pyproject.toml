[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "live-response"
version = "1.0.0"
description = "Live Response — Out-of-Band Security Orchestration, Automation, and Response Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "PyYAML>=6.0.2",
    "Jinja2>=3.1.4",
    "httpx>=0.27.2",
    "paramiko>=3.5.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
super = "soar.__main__:main"
soar = "soar.__main__:main"

[tool.setuptools.packages.find]
include = ["soar*"]
